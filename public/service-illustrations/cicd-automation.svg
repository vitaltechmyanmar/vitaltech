<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD automation illustration</title>
  <desc id="desc">Abstract pipeline showing code commit flowing through build, test, and deployment stages with automated checks.</desc>
