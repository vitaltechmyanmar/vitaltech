<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Vital Tech Myanmar — Enterprise Cloud &amp; DevOps Partner</title>
  <desc id="og-desc">Official social preview for Vital Tech Myanmar: Cloud Managed Services, CI/CD Automation, Infrastructure as Code, and SRE Observability.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="60%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#102544"/>
    </linearGradient>

    <!-- Official Brand Gradient -->
    <linearGradient id="vital-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1557E8"/>
      <stop offset="55%" stop-color="#16A8F5"/>
      <stop offset="100%" stop-color="#6657E8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Light Accents -->
  <circle cx="1060" cy="130" r="280" fill="#1557E8" opacity="0.16" filter="url(#soft-glow)"/>
  <circle cx="140" cy="530" r="240" fill="#6657E8" opacity="0.12" filter="url(#soft-glow)"/>
  <circle cx="620" cy="300" r="320" fill="#16A8F5" opacity="0.06" filter="url(#soft-glow)"/>

  <!-- Inner Elegant Border -->
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="none" stroke="#2454d8" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Subtle Blueprint Tech Grid in top right -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="840" y1="60" x2="1120" y2="60"/>
    <line x1="840" y1="110" x2="1120" y2="110"/>
    <line x1="840" y1="160" x2="1120" y2="160"/>
    <line x1="840" y1="210" x2="1120" y2="210"/>
    <line x1="840" y1="260" x2="1120" y2="260"/>
    <line x1="860" y1="40" x2="860" y2="280"/>
    <line x1="920" y1="40" x2="920" y2="280"/>
    <line x1="980" y1="40" x2="980" y2="280"/>
    <line x1="1040" y1="40" x2="1040" y2="280"/>
    <line x1="1100" y1="40" x2="1100" y2="280"/>
  </g>

  <!-- Header Brand Group (Official Symbol + Wordmark) -->
  <g transform="translate(80, 68)">
    <!-- Official V Symbol -->
    <g transform="scale(0.38)">
      <path d="M26 34h55c11 0 20 6 26 16l59 101h-56L69 53c-6-12-16-19-43-19Z" fill="url(#vital-gradient)"/>
      <path d="M230 34h-55c-11 0-20 6-26 16l-33 57h56l32-55c6-12 16-18 26-18Z" fill="url(#vital-gradient)"/>
      <path d="M107 107h56l-21 37c-6 11-15 18-29 18h-24l-18-31Z" fill="#6657E8"/>
      <path d="M26 34h55c11 0 20 6 26 16l76 132c6 11 15 18 29 18h-56c-11 0-20-6-26-18L26 34Z" fill="url(#vital-gradient)"/>
    </g>

    <!-- Divider -->
    <line x1="116" y1="12" x2="116" y2="68" stroke="#334b6e" stroke-width="2"/>

    <!-- Wordmark -->
    <text x="134" y="44" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8">VITAL TECH</text>
    <text x="136" y="66" fill="#8ca0be" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="8">MYANMAR</text>
  </g>

  <!-- Eyebrow Pill -->
  <g transform="translate(80, 206)">
    <rect width="324" height="34" rx="17" fill="#152b48" stroke="#2454d8" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4.5" fill="#16A8F5"/>
    <text x="35" y="22" fill="#93c5fd" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">ENTERPRISE CLOUD &amp; DEVOPS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 305)">
    <text fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.8">
      Cloud Managed Services &amp;
    </text>
    <text y="68" fill="url(#vital-gradient)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.8">
      Automated CI/CD Delivery.
    </text>
  </g>

  <!-- Subhead Copy -->
  <g transform="translate(80, 424)">
    <text fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="400" letter-spacing="-0.2">
      Architecting dependable AWS environments, declarative GitOps pipelines,
    </text>
    <text y="29" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="400" letter-spacing="-0.2">
      and proactive SRE observability for high-growth engineering teams.
    </text>
  </g>

  <!-- Bottom Capability Badges -->
  <g transform="translate(80, 508)">
    <!-- Badge 1: AWS -->
    <g transform="translate(0, 0)">
      <rect width="138" height="42" rx="8" fill="#11223b" stroke="#263f63" stroke-width="1"/>
      <text x="69" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">AWS Cloud</text>
    </g>

    <!-- Badge 2: Kubernetes -->
    <g transform="translate(150, 0)">
      <rect width="144" height="42" rx="8" fill="#11223b" stroke="#263f63" stroke-width="1"/>
      <text x="72" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Kubernetes</text>
    </g>

    <!-- Badge 3: Terraform -->
    <g transform="translate(306, 0)">
      <rect width="136" height="42" rx="8" fill="#11223b" stroke="#263f63" stroke-width="1"/>
      <text x="68" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Terraform</text>
    </g>

    <!-- Badge 4: GitOps & CI/CD -->
    <g transform="translate(454, 0)">
      <rect width="158" height="42" rx="8" fill="#11223b" stroke="#263f63" stroke-width="1"/>
      <text x="79" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">GitOps CI/CD</text>
    </g>

    <!-- Badge 5: Observability -->
    <g transform="translate(624, 0)">
      <rect width="186" height="42" rx="8" fill="#11223b" stroke="#263f63" stroke-width="1"/>
      <text x="93" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">SRE Observability</text>
    </g>

    <!-- Badge 6: Domain indicator -->
    <g transform="translate(822, 0)">
      <rect width="218" height="42" rx="8" fill="#173057" stroke="#2454d8" stroke-width="1.5"/>
      <text x="109" y="26" text-anchor="middle" fill="#93c5fd" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">vitaltechmyanmar.com</text>
    </g>
  </g>
</svg>
